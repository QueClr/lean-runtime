# lean-runtime's micro-benchmarks (benches/README.md): one binary per benchmark, generated by
# scripts/gen_benches.py; each has a native-Lean twin of the same name in benches/native/. A
# package of its own, so the crate's `cargo test` does not build it.
[package]
name = "lean-runtime-bench"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "lean_runtime_bench"
path = "src/lib.rs"

[dependencies]
lean-runtime = { path = "../.." }
# The allocator of Lean's runtime and of both translators, so that allocating pairs compare alike
# (benches/README.md). Only the benchmarks use it; the crate has no dependencies.
mimalloc = { version = "=0.1.52", default-features = false }

# The release profile of leanrs's measurement protocol (its chapter 07, M1).
[profile.release]
opt-level = 3
codegen-units = 1
lto = false
panic = "abort"
