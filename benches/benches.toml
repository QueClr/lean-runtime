[[bench]]
name = "string_utf8_strlen"
function = "string::utf8_strlen"
comparable = false
reason = "String.length reads the count cached in the string object, in Lean and in every translator; utf8_strlen is the count a translator caches when it makes a string"
o12 = "by inspection: the crate does strictly less work than C here (Lean allocates or reads a cached count), so the speed floor holds"

