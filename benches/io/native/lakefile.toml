# lean-runtime's native io micro-benchmarks (benches/io/README.md): one executable per benchmark,
# each the twin of the Rust binary of the same name in benches/io/rust/.
name = "iobench"
defaultTargets = ["io_put_str", "io_read", "io_get_line"]

[[lean_lib]]
name = "Bench"
roots = ["Bench.Harness"]

[[lean_exe]]
name = "io_put_str"
root = "Bench.IoPutStr"

[[lean_exe]]
name = "io_read"
root = "Bench.IoRead"

[[lean_exe]]
name = "io_get_line"
root = "Bench.IoGetLine"
