<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" role="img" aria-labelledby="ar1-t ar1-d">
  <title id="ar1-t">Modules, features and their dependencies</title>
  <desc id="ar1-d">The default build has semantics only, with no dependencies. Feature io adds the io module, which uses rustix and nix. Feature sched adds the sched module, which uses corosensei for the stack switch, rustix for the event loop and signal-hook for the signal watchers. Feature net adds the net module and turns on io and sched; it uses dns-lookup for name lookups, and the net features of rustix and nix. Feature proc-title turns on io and adds one file, the native quirk of the process title. Feature unsafe-fast is opt-in and has no entries yet. The crate root denies unsafe code; only the files that UNSAFE.md lists may allow it, and only with proc-title or unsafe-fast.</desc>
  <defs>
    <marker id="ar1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50555b"/></marker>
  </defs>
  <rect class="k-rt" x="20" y="20" width="1120" height="170" rx="8"/>
  <text class="tb" x="40" y="44">lean-runtime</text>
  <text class="ts" x="160" y="44">#![deny(unsafe_code)]: unsafe only in the files UNSAFE.md lists, with feature proc-title (the process title) or unsafe-fast</text>

  <rect class="k-none" x="40" y="60" width="220" height="110" rx="6"/>
  <text class="tb" x="150" y="86" text-anchor="middle">semantics</text>
  <text x="150" y="108" text-anchor="middle">default build</text>
  <text class="ts" x="150" y="128" text-anchor="middle">no dependencies</text>
  <text class="ts" x="150" y="146" text-anchor="middle">builds with plain rustc too</text>

  <rect class="k-none" x="280" y="60" width="220" height="110" rx="6"/>
  <text class="tb" x="390" y="86" text-anchor="middle">io</text>
  <text x="390" y="108" text-anchor="middle">feature io</text>
  <text class="ts" x="390" y="128" text-anchor="middle">built with cargo, offline,</text>
  <text class="ts" x="390" y="146" text-anchor="middle">from the committed Cargo.lock</text>

  <rect class="k-none" x="520" y="60" width="320" height="110" rx="6"/>
  <text class="tb" x="680" y="86" text-anchor="middle">sched</text>
  <text x="680" y="108" text-anchor="middle">feature sched</text>
  <text class="ts" x="680" y="128" text-anchor="middle">tasks, the event loop, Std.Internal.UV;</text>
  <text class="ts" x="680" y="146" text-anchor="middle">built with cargo, offline</text>

  <rect class="k-none" x="860" y="60" width="260" height="110" rx="6"/>
  <text class="tb" x="990" y="86" text-anchor="middle">net</text>
  <text x="990" y="108" text-anchor="middle">feature net (with io and sched)</text>
  <text class="ts" x="990" y="128" text-anchor="middle">TCP, UDP, DNS, interfaces;</text>
  <text class="ts" x="990" y="146" text-anchor="middle">also rustix and nix (net features)</text>

  <line class="ar" x1="390" y1="170" x2="330" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="390" y1="170" x2="490" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="560" y1="170" x2="350" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="680" y1="170" x2="680" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="800" y1="170" x2="855" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="1040" y1="170" x2="1045" y2="226" marker-end="url(#ar1-a)"/>

  <rect class="k-os" x="240" y="228" width="160" height="44" rx="6"/>
  <text x="320" y="248" text-anchor="middle">rustix 1.1</text>
  <text class="ts" x="320" y="264" text-anchor="middle">descriptor calls, epoll</text>
  <rect class="k-os" x="420" y="228" width="160" height="44" rx="6"/>
  <text x="500" y="248" text-anchor="middle">nix 0.31</text>
  <text class="ts" x="500" y="264" text-anchor="middle">process-level calls</text>
  <rect class="k-os" x="600" y="228" width="160" height="44" rx="6"/>
  <text x="680" y="248" text-anchor="middle">corosensei 0.3.4</text>
  <text class="ts" x="680" y="264" text-anchor="middle">stack switch</text>
  <rect class="k-os" x="780" y="228" width="160" height="44" rx="6"/>
  <text x="860" y="248" text-anchor="middle">signal-hook 0.3</text>
  <text class="ts" x="860" y="264" text-anchor="middle">signal delivery</text>
  <rect class="k-os" x="960" y="228" width="170" height="44" rx="6"/>
  <text x="1045" y="248" text-anchor="middle">dns-lookup 2.1.1</text>
  <text class="ts" x="1045" y="264" text-anchor="middle">getaddrinfo, getnameinfo</text>

  <rect class="k-none plan" x="40" y="228" width="180" height="44" rx="6"/>
  <text x="130" y="248" text-anchor="middle">unsafe-fast (opt-in)</text>
  <text class="ts" x="130" y="264" text-anchor="middle">no entries yet</text>

  <rect class="k-os" x="20" y="300" width="16" height="14" rx="2"/><text class="ts" x="42" y="312">vetted crate</text>
  <rect class="k-none plan" x="140" y="300" width="16" height="14" rx="2"/><text class="ts" x="162" y="312">empty</text>
</svg>
