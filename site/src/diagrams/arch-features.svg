<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="ar1-t ar1-d">
  <title id="ar1-t">Modules, features and their dependencies</title>
  <desc id="ar1-d">The default build has semantics only, with no dependencies. Feature io adds the io module, which uses rustix and nix. Feature sched adds the sched module, which uses corosensei for the stack switch, rustix for the event loop and signal-hook for the signal watchers. Feature unsafe-fast is opt-in and has no entries yet. The crate root denies unsafe code; only the files that UNSAFE.md lists may allow it.</desc>
  <defs>
    <marker id="ar1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50555b"/></marker>
  </defs>
  <rect class="k-rt" x="20" y="20" width="960" height="170" rx="8"/>
  <text class="tb" x="40" y="44">lean-runtime</text>
  <text class="ts" x="160" y="44">#![deny(unsafe_code)]: unsafe only in the files UNSAFE.md lists</text>

  <rect class="k-none" x="40" y="60" width="230" height="110" rx="6"/>
  <text class="tb" x="155" y="86" text-anchor="middle">semantics</text>
  <text x="155" y="108" text-anchor="middle">default build</text>
  <text class="ts" x="155" y="128" text-anchor="middle">no dependencies</text>
  <text class="ts" x="155" y="146" text-anchor="middle">builds with plain rustc too</text>

  <rect class="k-none" x="310" y="60" width="230" height="110" rx="6"/>
  <text class="tb" x="425" y="86" text-anchor="middle">io</text>
  <text x="425" y="108" text-anchor="middle">feature io</text>
  <text class="ts" x="425" y="128" text-anchor="middle">built with cargo, offline,</text>
  <text class="ts" x="425" y="146" text-anchor="middle">from the committed Cargo.lock</text>

  <rect class="k-none" x="580" y="60" width="380" height="110" rx="6"/>
  <text class="tb" x="770" y="86" text-anchor="middle">sched</text>
  <text x="770" y="108" text-anchor="middle">feature sched</text>
  <text class="ts" x="770" y="128" text-anchor="middle">tasks, the event loop, Std.Internal.UV;</text>
  <text class="ts" x="770" y="146" text-anchor="middle">built with cargo, offline</text>

  <line class="ar" x1="425" y1="170" x2="340" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="425" y1="170" x2="510" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="600" y1="170" x2="400" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="740" y1="170" x2="720" y2="226" marker-end="url(#ar1-a)"/>
  <line class="ar" x1="860" y1="170" x2="895" y2="226" marker-end="url(#ar1-a)"/>

  <rect class="k-os" x="250" y="228" width="170" height="44" rx="6"/>
  <text x="335" y="248" text-anchor="middle">rustix 1.1</text>
  <text class="ts" x="335" y="264" text-anchor="middle">descriptor calls, epoll</text>
  <rect class="k-os" x="430" y="228" width="170" height="44" rx="6"/>
  <text x="515" y="248" text-anchor="middle">nix 0.31</text>
  <text class="ts" x="515" y="264" text-anchor="middle">process-level calls</text>
  <rect class="k-os" x="635" y="228" width="170" height="44" rx="6"/>
  <text x="720" y="248" text-anchor="middle">corosensei 0.3.4</text>
  <text class="ts" x="720" y="264" text-anchor="middle">stack switch</text>
  <rect class="k-os" x="815" y="228" width="160" height="44" rx="6"/>
  <text x="895" y="248" text-anchor="middle">signal-hook 0.3</text>
  <text class="ts" x="895" y="264" text-anchor="middle">signal delivery</text>

  <rect class="k-none plan" x="40" y="228" width="190" height="44" rx="6"/>
  <text x="135" y="248" text-anchor="middle">unsafe-fast (opt-in)</text>
  <text class="ts" x="135" y="264" text-anchor="middle">no entries yet</text>

  <rect class="k-os" x="20" y="300" width="16" height="14" rx="2"/><text class="ts" x="42" y="312">vetted crate</text>
  <rect class="k-none plan" x="140" y="300" width="16" height="14" rx="2"/><text class="ts" x="162" y="312">empty</text>
</svg>
