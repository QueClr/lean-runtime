<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" role="img" aria-labelledby="ov1-t ov1-d">
  <title id="ov1-t">From a Lean program to the operating system</title>
  <desc id="ov1-d">A Lean program goes to lean2rr or leanrs. Each translator makes code, which calls its own glue. Both glues call lean-runtime, which has the modules semantics, io and sched. lean-runtime calls std, rustix, nix and corosensei, which call Linux and glibc.</desc>
  <defs>
    <marker id="ov1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50555b"/></marker>
  </defs>
  <rect class="k-lean" x="330" y="10" width="200" height="46" rx="6"/>
  <text class="tb" x="430" y="30" text-anchor="middle">Lean program</text>
  <text class="ts" x="430" y="47" text-anchor="middle">compiled by Lean 4.34.0</text>

  <line class="ar" x1="390" y1="56" x2="300" y2="88" marker-end="url(#ov1-a)"/>
  <line class="ar" x1="470" y1="56" x2="560" y2="88" marker-end="url(#ov1-a)"/>

  <rect class="k-tr" x="140" y="90" width="240" height="50" rx="6"/>
  <text class="tb" x="260" y="111" text-anchor="middle">lean2rr</text>
  <text class="ts" x="260" y="129" text-anchor="middle">translator: Lean to Reussir</text>
  <rect class="k-tr" x="480" y="90" width="240" height="50" rx="6"/>
  <text class="tb" x="600" y="111" text-anchor="middle">leanrs</text>
  <text class="ts" x="600" y="129" text-anchor="middle">translator: Lean to Rust</text>

  <line class="ar" x1="260" y1="140" x2="260" y2="168" marker-end="url(#ov1-a)"/>
  <line class="ar" x1="600" y1="140" x2="600" y2="168" marker-end="url(#ov1-a)"/>

  <rect class="k-tr" x="140" y="170" width="240" height="44" rx="6"/>
  <text x="260" y="197" text-anchor="middle">generated Reussir code</text>
  <rect class="k-tr" x="480" y="170" width="240" height="44" rx="6"/>
  <text x="600" y="197" text-anchor="middle">generated Rust code</text>

  <line class="ar" x1="260" y1="214" x2="260" y2="242" marker-end="url(#ov1-a)"/>
  <line class="ar" x1="600" y1="214" x2="600" y2="242" marker-end="url(#ov1-a)"/>

  <rect class="k-glue" x="140" y="244" width="240" height="52" rx="6"/>
  <text class="tb" x="260" y="265" text-anchor="middle">lean2rr glue</text>
  <text class="ts" x="260" y="284" text-anchor="middle">its value layout and memory</text>
  <rect class="k-glue" x="480" y="244" width="240" height="52" rx="6"/>
  <text class="tb" x="600" y="265" text-anchor="middle">leanrs glue</text>
  <text class="ts" x="600" y="284" text-anchor="middle">its value layout and memory</text>

  <line class="ar" x1="260" y1="296" x2="260" y2="326" marker-end="url(#ov1-a)"/>
  <line class="ar" x1="600" y1="296" x2="600" y2="326" marker-end="url(#ov1-a)"/>
  <text class="ts" x="400" y="316" text-anchor="middle">views and plain data</text>

  <rect class="k-rt" x="60" y="328" width="740" height="110" rx="8"/>
  <text class="tb" x="80" y="350">lean-runtime: one shared Rust crate, safe Rust</text>
  <rect class="k-none" x="80" y="362" width="220" height="62" rx="6"/>
  <text class="tb" x="190" y="386" text-anchor="middle">semantics</text>
  <text class="ts" x="190" y="405" text-anchor="middle">rules on views, always built</text>
  <rect class="k-none" x="320" y="362" width="220" height="62" rx="6"/>
  <text class="tb" x="430" y="386" text-anchor="middle">io</text>
  <text class="ts" x="430" y="405" text-anchor="middle">files, handles, exit (feature io)</text>
  <rect class="k-none" x="560" y="362" width="220" height="62" rx="6"/>
  <text class="tb" x="670" y="386" text-anchor="middle">sched</text>
  <text class="ts" x="670" y="405" text-anchor="middle">tasks, Std.Sync (feature sched)</text>

  <line class="ar" x1="430" y1="438" x2="430" y2="466" marker-end="url(#ov1-a)"/>
  <rect class="k-os" x="230" y="468" width="400" height="40" rx="6"/>
  <text x="430" y="493" text-anchor="middle">std, rustix, nix, corosensei (vetted crates)</text>
  <line class="ar" x1="430" y1="508" x2="430" y2="532" marker-end="url(#ov1-a)"/>
  <rect class="k-os" x="230" y="534" width="400" height="40" rx="6"/>
  <text x="430" y="559" text-anchor="middle">Linux kernel and glibc (libm)</text>

  <!-- key -->
  <rect class="k-lean" x="60" y="592" width="16" height="14" rx="2"/><text class="ts" x="82" y="604">Lean</text>
  <rect class="k-tr" x="140" y="592" width="16" height="14" rx="2"/><text class="ts" x="162" y="604">translator and its code</text>
  <rect class="k-glue" x="320" y="592" width="16" height="14" rx="2"/><text class="ts" x="342" y="604">glue (per translator)</text>
  <rect class="k-rt" x="490" y="592" width="16" height="14" rx="2"/><text class="ts" x="512" y="604">lean-runtime</text>
  <rect class="k-os" x="610" y="592" width="16" height="14" rx="2"/><text class="ts" x="632" y="604">crates, OS, libraries</text>
</svg>
