<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="ar2-t ar2-d">
  <title id="ar2-t">What stays in each translator's glue and what is shared</title>
  <desc id="ar2-d">Left column, each translator's glue: value representation, memory protocol, hot paths on its own types, conversion to views, and the steps that safe Rust in the crate cannot do. Right column, lean-runtime: the semantics rules, the io model and the scheduler.</desc>
  <rect class="k-glue" x="20" y="20" width="400" height="364" rx="8"/>
  <text class="tb" x="40" y="46">In each translator's glue</text>
  <rect class="k-none" x="40" y="60" width="360" height="46" rx="5"/>
  <text x="56" y="80">Value representation</text>
  <text class="ts" x="56" y="97">Nat words, strings, arrays, user types</text>
  <rect class="k-none" x="40" y="114" width="360" height="46" rx="5"/>
  <text x="56" y="134">Memory protocol</text>
  <text class="ts" x="56" y="151">reference counts, ownership, freeing</text>
  <rect class="k-none" x="40" y="168" width="360" height="46" rx="5"/>
  <text x="56" y="188">Hot paths on its own types</text>
  <text class="ts" x="56" y="205">the Nat fast path, in-place string and array updates</text>
  <rect class="k-none" x="40" y="222" width="360" height="46" rx="5"/>
  <text x="56" y="242">Thin wrappers</text>
  <text class="ts" x="56" y="259">its objects to views, plain data back to its objects</text>
  <rect class="k-none" x="40" y="276" width="360" height="94" rx="5"/>
  <text x="56" y="296">Steps the crate's safe code cannot do</text>
  <text class="ts" x="56" y="314">the one dereference in Glue::suspend (sched)</text>
  <text class="ts" x="56" y="330">an ELF constructor that opens the startup descriptors</text>
  <text class="ts" x="56" y="346">a SIGSEGV handler for stack overflow (sched)</text>
  <text class="ts" x="56" y="362">call exit_flush at exit (no atexit without unsafe)</text>

  <rect class="k-rt" x="440" y="20" width="400" height="364" rx="8"/>
  <text class="tb" x="460" y="46">In lean-runtime (shared)</text>
  <rect class="k-none" x="460" y="60" width="360" height="94" rx="5"/>
  <text x="476" y="80">semantics</text>
  <text class="ts" x="476" y="98">Nat and Int rules over a big-number trait</text>
  <text class="ts" x="476" y="114">integer, float and libm rows; string positions</text>
  <text class="ts" x="476" y="130">hashes, array edge rules, panic texts, leaf text</text>
  <rect class="k-none" x="460" y="162" width="360" height="94" rx="5"/>
  <text x="476" y="182">io</text>
  <text class="ts" x="476" y="200">glibc's FILE model, handles, IO.Error</text>
  <text class="ts" x="476" y="216">file system, environment, clock</text>
  <text class="ts" x="476" y="232">startup descriptors, the exit sequence</text>
  <text class="ts" x="476" y="248">processes and streams (io-2)</text>
  <rect class="k-none" x="460" y="264" width="360" height="106" rx="5"/>
  <text x="476" y="284">sched (sched-1)</text>
  <text class="ts" x="476" y="302">task queues, contexts, the hub</text>
  <text class="ts" x="476" y="318">yield points, promises, cancellation</text>
  <text class="ts" x="476" y="334">Std.Sync mutexes and condition variable</text>
  <text class="ts" x="476" y="350">the exit order: tasks first, then flush</text>
</svg>
