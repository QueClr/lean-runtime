<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="te1-t te1-d">
  <title id="te1-t">The test flow</title>
  <desc id="te1-d">Native Lean 4.34.0 records the expected values. gen_rows.py runs the oracle and writes rows. cases.py expect builds program cases natively and writes their outputs. Both go into tests/cases. The rows check the crate. The program cases check the Rust twins, lean2rr's builds and leanrs's builds. Every bug or disagreement found becomes a new case. Other checks: the glibc differential test, the libm folding test, and check.sh.</desc>
  <defs>
    <marker id="te1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50555b"/></marker>
  </defs>
  <rect class="k-lean" x="20" y="150" width="170" height="70" rx="6"/>
  <text class="tb" x="105" y="176" text-anchor="middle">native Lean 4.34.0</text>
  <text class="ts" x="105" y="196" text-anchor="middle">aarch64 Linux,</text>
  <text class="ts" x="105" y="211" text-anchor="middle">glibc 2.39</text>

  <rect class="k-test" x="230" y="60" width="185" height="60" rx="6"/>
  <text class="tc" x="322" y="85" text-anchor="middle">gen_rows.py</text>
  <text class="ts" x="322" y="105" text-anchor="middle">runs scripts/oracle</text>
  <rect class="k-test" x="230" y="250" width="185" height="60" rx="6"/>
  <text class="tc" x="322" y="275" text-anchor="middle">cases.py expect</text>
  <text class="ts" x="322" y="295" text-anchor="middle">5 identical runs</text>
  <line class="ar" x1="190" y1="170" x2="250" y2="122" marker-end="url(#te1-a)"/>
  <line class="ar" x1="190" y1="200" x2="250" y2="248" marker-end="url(#te1-a)"/>

  <rect class="k-test" x="450" y="40" width="190" height="290" rx="8"/>
  <text class="tb" x="545" y="62" text-anchor="middle">tests/cases/</text>
  <rect class="k-none" x="465" y="74" width="160" height="62" rx="5"/>
  <text x="545" y="97" text-anchor="middle">rows</text>
  <text class="ts" x="545" y="116" text-anchor="middle">one call, its expected value</text>
  <rect class="k-none" x="465" y="244" width="160" height="72" rx="5"/>
  <text x="545" y="266" text-anchor="middle">program cases</text>
  <text class="ts" x="545" y="285" text-anchor="middle">a Lean program and its</text>
  <text class="ts" x="545" y="300" text-anchor="middle">stdout, stderr, exit code</text>
  <line class="ar" x1="415" y1="90" x2="463" y2="100" marker-end="url(#te1-a)"/>
  <line class="ar" x1="415" y1="280" x2="463" y2="280" marker-end="url(#te1-a)"/>

  <rect class="k-rt" x="680" y="40" width="165" height="56" rx="6"/>
  <text x="762" y="62" text-anchor="middle">the crate</text>
  <text class="tc" x="762" y="82" text-anchor="middle">rows.rs, rows2.rs</text>
  <rect class="k-rt" x="680" y="116" width="165" height="56" rx="6"/>
  <text x="762" y="138" text-anchor="middle">Rust twins</text>
  <text class="ts" x="762" y="158" text-anchor="middle">over lean-runtime</text>
  <rect class="k-tr" x="680" y="192" width="165" height="56" rx="6"/>
  <text x="762" y="214" text-anchor="middle">lean2rr's builds</text>
  <text class="tc" x="762" y="234" text-anchor="middle">cases.py check</text>
  <rect class="k-tr" x="680" y="268" width="165" height="56" rx="6"/>
  <text x="762" y="290" text-anchor="middle">leanrs's builds</text>
  <text class="tc" x="762" y="310" text-anchor="middle">cases.py check</text>
  <line class="ar" x1="625" y1="100" x2="678" y2="70" marker-end="url(#te1-a)"/>
  <line class="ar" x1="625" y1="270" x2="678" y2="146" marker-end="url(#te1-a)"/>
  <line class="ar" x1="625" y1="280" x2="678" y2="222" marker-end="url(#te1-a)"/>
  <line class="ar" x1="625" y1="292" x2="678" y2="296" marker-end="url(#te1-a)"/>

  <path class="ard" d="M762,324 V352 H545 V332" marker-end="url(#te1-a)"/>
  <text class="ts" x="655" y="368" text-anchor="middle">every bug or disagreement becomes a new case</text>

  <rect class="k-test" x="20" y="400" width="250" height="52" rx="6"/>
  <text x="145" y="422" text-anchor="middle">glibc differential test</text>
  <text class="ts" x="145" y="440" text-anchor="middle">real glibc FILE against the model</text>
  <rect class="k-test" x="300" y="400" width="250" height="52" rx="6"/>
  <text x="425" y="422" text-anchor="middle">libm folding test</text>
  <text class="ts" x="425" y="440" text-anchor="middle">constant against run-time operands</text>
  <rect class="k-test" x="580" y="400" width="265" height="52" rx="6"/>
  <text class="tc" x="712" y="422" text-anchor="middle">scripts/check.sh</text>
  <text class="ts" x="712" y="440" text-anchor="middle">before each commit</text>
  <text class="ts" x="20" y="388">Other checks:</text>
</svg>
