# Row cases of area `panic` (format: tests/cases/README.md). Expected values
# from native Lean 4.34.0 through scripts/oracle; rebuild them with
# `scripts/gen_rows.py tests/cases/panic/panic.rows.toml`.
# `panic` is `panic (msg) : Nat`, whose default is 0.

[[row]]
id = "panic/panic.boom"
area = "panic"
fn = "panic"
args = ['"boom"']
expected = "panic: boom"
default = "0"
stderr = "boom\n"
lean_version = "4.34.0"
source = "lean-runtime batch 2: lean_panic_fn (object.cpp lean_panic_impl): the message on Lean's stderr stream, the default returned; LEAN_BACKTRACE=0 as the oracle runs"

