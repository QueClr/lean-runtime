native = { stdout = "0th tick: some\ncancel: begin\ncancel: end\n", stderr = "", code = "timeout" }
# `expected` is the correct outcome: the repeating timer keeps running
# without a promise during the release (lean-runtime's own order for
# `cancel`: Lean master's `cancel` is unchanged, so this is our correction),
# so the dependent's re-subscription is kept by the timer and the next tick
# resolves it. Native Lean 4.34.0's outcome, recorded over 5 runs, is
# `native`: the re-subscription is overwritten without a release and never
# resolves, so `main` waits forever.
