id = "signal_cancel_rearm_in_sync_dependent"
area = "uvloop"
lean_version = "4.34.0"
source = "LB-34 (docs/lean-bugs.md; lean2rr-side judge 2026-10-04, leanrs cross-check agreed; the judge's cases list, judge/lb33/LB-34.md); probe SignalVariants.lean cancel"
streams = "separate"
expect = { hang = 5 }
deviations = { lean2rr = "LB-34", leanrs = "LB-34; DV2" }
# leanrs: DV2 until it adopts sched/ (it refuses Std.Internal.UV's timers and signals at translation, so it has no executable for uvloop's cases).
native = { stdout = "cancel: begin\ncancel: end\nmain's next after cancel: some 10\ndependent values: #[none]\nstop: end\n", stderr = "", code = "timeout" }
# `expected` is the correct outcome: the repeating watcher keeps listening
# without a promise during the release (lean-runtime's own order for
# `cancel`: Lean master's `cancel` is unchanged, so this is our correction),
# so the dependent's re-subscription is kept, `main`'s `next` gives it, and
# the signal resolves it; its second run is in the walk of `sync`
# dependents, before `main` wakes. Native Lean 4.34.0's outcome, recorded
# over 5 runs, is `native`: the re-subscription is lost, and the double free
# leaves the process hanging at exit.
