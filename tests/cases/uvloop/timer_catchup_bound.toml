# The program changed (LB-33): its dependent subscribes again only on `some`. The original subscribed again on any value, and ended only through 4.34.0's bug: its `stop` loses the dependent's re-subscription. With the correct `stop` (Lean master's, PR #14793), re-subscribing on `none` never ends. Native's output does not change: at `t.stop` the dependent reads `none` once and returns.
