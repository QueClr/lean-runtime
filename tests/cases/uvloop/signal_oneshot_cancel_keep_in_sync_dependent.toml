# `expected` is the correct outcome: the watcher is initial again before
# the release (lean-runtime's own order for `cancel`: Lean master's `cancel`
# is unchanged), so the dependent's `next` starts it listening again and
# gives its new promise, which no signal resolves. Native Lean 4.34.0's
# outcome, recorded over 5 runs, is `native`: `next` gives the promise being
# freed (a use after free); a fresh promise takes its memory.
