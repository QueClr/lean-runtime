# `expected` is the correct outcome: the stopped timer's `next` gives a new
# promise that the timer does not hold (Lean master's `stop`, PR #14793), and
# the program holds it, so it stays pending and is no other promise. Native
# Lean 4.34.0's outcome, recorded over 5 runs, is `native`: `next` gives the
# promise being freed (a use after free); a fresh promise takes its memory.
