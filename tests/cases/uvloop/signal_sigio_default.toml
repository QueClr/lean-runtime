id = "signal_sigio_default"
area = "uvloop"
lean_version = "4.34.0"
source = "sched-io Part B review RSIOB-06 (review-sched-io-b/repro/r11_sigio.lean)"
streams = "separate"
deviations = { lean2rr = "lean-runtime RSIOB-06", leanrs = "lean-runtime RSIOB-06; DV2" }
# leanrs: DV2 until it adopts sched/ (it refuses Std.Internal.UV's timers and signals at translation, so it has no executable for uvloop's cases).
# .pipe reports how the program ended, as `subprocess` sees it: natively
# SIGIO's default action kills it (returncode -29); lean-runtime, with no
# safe way to restore SIGIO's default disposition, exits with status 157
# (128 + 29), the same `$?` and `IO.Process.wait` result (alt1; docs/sched.md,
# "Std.Internal.UV"). The deviation names no Lean bug, so native's outcome
# passes too.
