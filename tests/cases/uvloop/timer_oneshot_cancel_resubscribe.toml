source = "LB-33 (docs/lean-bugs.md; lean2rr-side judge 2026-10-04, leanrs cross-check agreed; the judge's cases list, judge/lb33/LB-33.md); probe oneshot_cancel_probe (lean-runtime-work/fixes-2/probes)"
