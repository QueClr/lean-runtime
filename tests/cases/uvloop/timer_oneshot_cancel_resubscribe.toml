# leanrs: DV2 until it adopts sched/ (it refuses Std.Internal.UV's timers and signals at translation, so it has no executable for uvloop's cases).
native = { stdout = "cancel: begin\ndependent 1: value none\ndependent 2: value none\ndependent 3: value none\ndependent 4: value none\ndependent 5: value none\ncancel: end\ndependent runs: 5\nstop: begin\nstop: end\n", stderr = "", code = "0" }
# `expected` is the correct outcome: the timer is initial again before the
# release (lean-runtime's own order for `cancel`, a judgement of LB-33: Lean
# master's `cancel` is unchanged), so the dependent's `next` starts it again
# and its promise stays pending; `stop` drops that promise, and the dependent
# then runs up to its cap inside `stop`. Native Lean 4.34.0's outcome,
# recorded over 5 runs, is `native`: inside `cancel`, `next` gives the
# promise being released, which has read `none`, so the dependent runs up to
# its cap there.
