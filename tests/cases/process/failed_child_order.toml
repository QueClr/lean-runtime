# LB-42: the expected files are the correct outcomes, written by hand: the parent's line first
# (failed_child_order.*) or the child's message first (.alt1.*), the parent's pending bytes once,
# at its exit. Native's outcomes are wrong and schedule dependent (in 300 native runs on a loaded
# host, review RIO2-19), each with the pending bytes twice, the child's copy flushed before its
# message: "parent after spawn\npending could not execute external process
# 'no-such-program-xyz'\nwaited 255\npending " (283); "pending could not execute external process
# 'no-such-program-xyz'\nparent after spawn\nwaited 255\npending " (13); "pending parent after
# spawn\ncould not execute external process 'no-such-program-xyz'\nwaited 255\npending " (4).
# The deterministic case of LB-42 is process/failed_child_pending_stdout.
