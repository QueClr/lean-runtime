id = "output_drain_exit_exit"
area = "process"
lean_version = "4.34.0"
source = "AR-6, leanrs's review of lean-runtime fixes-1 (87d4446); LB-29 (docs/lean-bugs.md; lean2rr-side judge, 2026-10-04)"
streams = "separate"
