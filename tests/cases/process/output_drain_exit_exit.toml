native = { stdout = "output failed: Tried to read from handle containing non UTF-8 data.\nmain ends\nchild: write status 0\n", stderr = "", code = "0" }
# Natively the `IO.Process.exit 0` waits about 1 s, in glibc's `_IO_flush_all`, for the lock of
# the standard-output pipe's stream, which `output`'s reader task holds in `fread` until the
# child's end of file; so the child's late write finds a reader (status 0). Correct (LB-29):
# the process ends at once, its end of the pipe closes, and the write fails with `EPIPE`
# (status 1), as after `forceExit` (`output_drain_exit_force`, native-followed). The expected
# files are the correct outcome, written by hand.
