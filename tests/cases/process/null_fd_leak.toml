id = "null_fd_leak"
area = "process"
lean_version = "4.34.0"
source = "lean-runtime io-2: process.cpp spawn (open(\"/dev/null\") then dup2, the opened descriptor left open across execvp); LB-15 (docs/lean-bugs.md; lean2rr-side judge, leanrs-side judge confirms, 2026-10-04)"
streams = "separate"
deviations = { lean2rr = "LB-15", leanrs = "LB-15" }
native = { stdout = "stdin and stdout null: 2\nstdout null: 1\nnone null: 0\n", stderr = "", code = "0" }
# `expected` (the .out, .err and .code files) is the correct outcome, which both translators
# give: the program the child runs keeps no /dev/null descriptor. Native's outcome is `native`:
# the program keeps one descriptor on /dev/null per null stream (it takes the lowest number free
# in the forked child, above the parent's close-on-exec descriptors, so it shifts no descriptor
# the program sees first).
