# `expected` (the .out, .err and .code files) is the correct outcome, which both translators
# give: the spawn fails with the open's EMFILE, and the parent reads line1. Native's outcome is
# `native`: with the parent's descriptors exhausted, the forked child's open("/dev/null") fails
# unchecked, so a `null` stdout writes to the parent's stdout and a `null` stdin reads the
# parent's first line. The program keeps its handles open to the end, or the defect does not show.
