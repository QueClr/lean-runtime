# `expected` is native's: with the parent's descriptors exhausted, the forked child's
# open("/dev/null") fails unchecked, so a `null` stdout writes to the parent's stdout and a `null`
# stdin reads the parent's first line. The correct behaviour, which both translators give, is the
# alternative outcome null_open_fails.alt1.*: the spawn fails with the open's EMFILE, and the
# parent reads line1. The program keeps its handles open to the end, or the defect does not show.
