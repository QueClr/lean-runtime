id = "title_fd_limit"
area = "uvsys"
lean_version = "4.34.0"
source = "lean2rr runtime switch step 3 review RST3-01 (AR-20): the shared runtime's title constructor ran after a translator's startup constructor and found too few free descriptors; libuv 1.48 uv_setup_args, called by lean_setup_args before the loop opens its descriptors"
streams = "separate"
deviations = { leanrs = "DV2" }
