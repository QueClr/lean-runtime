# `expected` (the .out, .err and .code files) is the correct outcome, written by
# hand: every priority above 8 is a dedicated task. Native Lean 4.34.0's outcome
# is `native`. At 2^32 - 1 (`LEAN_SYNC_PRIO` after the cut to an `unsigned`) each
# task runs inside its spawn on `main`'s thread: in part 1 it prints the `sync`
# task panic and gets the rescuer's value a second later; in part 2 it sees the
# worker busy and frees it, as a dedicated task does. At 2^32 (priority 0 after
# the cut) the `IO.asTask`, `IO.mapTask` and `IO.bindTask` of part 2 wait in the
# pool's queue behind `busy` until the rescuer frees the worker. At 2^64 native
# passes the bits of the big `Nat`'s pointer, shifted right by one, which in
# practice are above 8 (a dedicated task, by chance).
