id = "sync_walk_mutex_unref_finish"
area = "tasks"
lean_version = "4.34.0"
source = "review of lean-runtime sched-2, round 3 (RS2-08; probe MutexWalkUnref), 2026-10-04"
streams = "separate"
expect = { hang = 3 }
# A blocking `sync` continuation, documented misuse: `Task.map` with
# `sync := true` "should only be done when executing `f` is cheap and
# non-blocking" (Init/Core.lean), and of a blocking wait in such a
# continuation `Task.get` says "deadlocks may otherwise occur". Natively the
# waiter of `r` wakes only when another referenced task finishes
# (`resolve_core`'s `notify_all`; a deleted task's finish skips it).
# Native's outcome is followed: not LB-32, which covers
# `Promise.result!`'s permanent block only.
deviations = { leanrs = "DV2" }
# leanrs DV2: IO.Promise refused at translation
