[package]
name = "lean-runtime"
version = "0.1.0"
edition = "2021"
description = "Lean 4.34.0's runtime behaviour, shared by the lean2rr and leanrs translators"
publish = false

[lib]
name = "lean_runtime"
path = "src/lib.rs"

# The default build has no dependencies. The optional layers make their
# system calls and stack switches through vetted crates, so that the crate
# itself stays free of `unsafe` (except the native quirks of UNSAFE.md, each
# behind a feature of its own: so far `proc-title`, the write of the process
# title into the arguments' memory, `startup-fds`, the constructor that opens
# libuv's startup descriptors, and `stack-overflow`, Lean's stack-overflow
# report for the scheduler's contexts):
# - `io`: rustix (the FILE model's descriptor calls, the clock, waitpid, kill,
#   the scheduling priority), nix (process-level libc calls: posix_spawn,
#   unshare, poll, the password and group databases, getrusage,
#   gethostname, and glibc's own isatty, one TCGETS ioctl as natively,
#   AR-18) and io-uring (the two rings libuv makes at startup; pinned
#   exactly, with only `io_safety`, which adds no crate);
# - `sched`: corosensei (decisions Q5 and O2), with its default features
#   (mmap'd stacks with a guard page, and unwinding across the switch),
#   rustix (the event loop's epoll and poll; sched-io), and signal-hook (the
#   `Std.Internal.UV.Signal` watchers: its safe flag, self-pipe and
#   conditional default actions; accepted by the owner, 2026-10-04);
# - `proc-title`: rustix's `mm` (the `mmap` of the constructor's block,
#   AR-36); `startup-fds`: nix's re-exported libc (`getenv` in the
#   constructor, which reads the environment without allocating);
# - `stack-overflow`: nix (its `sigaction` and re-exported libc, for the
#   native quirk of Lean's stack-overflow report, `sched::stack_overflow`;
#   AR-11).
# - `threads` (threads mode, `sched::mt`): the task manager uses std's
#   threads, locks, condition variables and atomics only; its
#   `Std.Internal.UV` loop thread (`sched::uv` in threads mode, T2) uses
#   rustix (`poll` and the async eventfd) and signal-hook (the signal
#   watchers' delivery), as `sched`'s loop does.
# The requirements are carets compatible with leanrs's offline registry (nix
# 0.31.3, rustix 1.1.4, io-uring 0.7.13, corosensei 0.3.4, signal-hook 0.3.18), with only the features the crate
# uses; leanrs resolves them in its own workspace. lean-runtime's own builds
# and lean2rr's use Cargo.lock and cargo's local registry cache, offline
# (`cargo build --offline --locked --features io,sched`; `cargo fetch
# --locked` once fills the cache).
[dependencies]
rustix = { version = "1.1", optional = true, default-features = false, features = ["std", "event", "fs", "pipe", "process", "stdio", "system", "termios", "time"] }
nix = { version = "0.31", optional = true, default-features = false, features = ["fs", "hostname", "poll", "process", "resource", "sched", "signal", "user"] }
io-uring = { version = "=0.7.13", optional = true, default-features = false, features = ["io_safety"] }
corosensei = { version = "0.3.4", optional = true }
signal-hook = { version = "0.3.18", optional = true, default-features = false }
# `net` only: glibc's getaddrinfo and getnameinfo with libuv's hints (approved
# 2026-10-04, pinned exactly; its unsafe is audited in UNSAFE.md).
dns-lookup = { version = "=2.1.1", optional = true, default-features = false }

[features]
default = []
# OS-level IO mirroring Lean's C runtime (files, handles, standard streams).
io = ["dep:rustix", "dep:nix", "dep:io-uring"]
# The deferred task scheduler, promises and Std.Sync, on one thread
# (coroutines; docs/sched.md).
sched = ["dep:corosensei", "dep:rustix", "dep:signal-hook"]
# Threads mode (docs/threads.md): `sched::mt`, Lean's task manager on real
# threads (a pool of `LEAN_NUM_THREADS` workers, a thread per dedicated
# task), promises, Std.Sync and the 4.35 ref rule, with `Send` jobs and a
# `Send + Sync` glue; `sched::` re-exports it, with the single-thread
# scheduler's names. It excludes `sched` (and so `net`, which turns `sched`
# on): a build has one scheduler, and both on is a compile error. With `io`
# (allowed), the io layer takes its plain blocking path, as without `sched`:
# a blocking call blocks its own thread, as natively. Where
# `unshare(CLONE_FS)` is refused (Docker's default seccomp profile), a spawn
# with a `cwd` moves the process's working directory meanwhile, so there
# every lookup of a path the program supplies holds the working directory's
# lock shared (review RT1-04, T2). `sched::uv` is `Std.Internal.UV`'s loop on
# a thread of its own, as natively (T2). With `stack-overflow`, every
# worker, dedicated thread and the loop thread installs Lean's report at its
# entry.
threads = ["dep:rustix", "dep:signal-hook"]
# Networking (Std.Internal.UV.TCP/UDP/DNS, Std.Net.interfaceAddresses) on the
# scheduler's event loop: an optional module a translator admits per program.
net = ["io", "sched", "dep:dns-lookup", "rustix/net", "nix/net"]
# The process title in the arguments' memory (`io::argv_title`, a native
# quirk written with `unsafe`: UNSAFE.md, docs/native-quirks.md): the
# crate's ELF constructor keeps the arguments' memory, and `setProcessTitle`
# writes the title there, as libuv does. lean2rr enables it. Without it,
# `setProcessTitle` fails with ENOBUFS, as libuv does when it holds no
# arguments' memory, and `getProcessTitle` gives `argv[0]`. The constructor
# uses no global allocator (AR-36): it copies the arguments into a block of
# its own that it maps with rustix's `mmap` (its `mm` feature: no new crate).
proc-title = ["io", "rustix/mm"]
# The descriptors native Lean opens before `main` (libuv's loop: epoll, the
# io_uring rings, the signal lock pipe, the signal pipe, the eventfd), opened
# by an ELF constructor of the crate (`io::startup`'s native quirk, written
# with `unsafe`: UNSAFE.md, docs/native-quirks.md; audit item 4.3), before
# Rust's runtime puts `/dev/null` in the place of a closed standard
# descriptor, so a closed standard descriptor is taken by the first of them,
# as natively. Its section `.init_array.00101` makes it run right after
# `proc-title`'s (AR-20). It acts only in the program's own executable,
# never in a shared library (RSH2-02), and uses no global allocator (AR-36).
# lean2rr enables it. Without it, a translator that wants native's descriptors writes
# the constructor in its own glue (`io::startup::open_native_descriptors`).
startup-fds = ["io"]
# Lean's stack-overflow report for the scheduler's contexts and the threads
# that run them (`sched::stack_overflow`, a native quirk written with
# `unsafe`: UNSAFE.md, docs/native-quirks.md, AR-11):
# `sched::install_stack_overflow_handler()` installs a SIGSEGV/SIGBUS handler
# that knows the contexts' guard pages, and prints Lean's
# `Stack overflow detected. Aborting.` (status 134). lean2rr enables it.
# Without it, a task that overflows its context's stack ends with a plain
# SIGSEGV (status 139), and the hub updates no record (no cost).
# It needs a scheduler: enable it with `sched` or with `threads` (it no
# longer turns `sched` on, since threads mode excludes `sched`; alone, it is
# a compile error).
stack-overflow = ["dep:nix"]
# Opt-in faster implementations that use `unsafe` (see UNSAFE.md and
# docs/development.md).
unsafe-fast = []
# The crate's own code contains no `unsafe` unless `proc-title`,
# `startup-fds`, `stack-overflow` or `unsafe-fast` is enabled: without them
# the crate root forbids it. The `unsafe` of the dependencies is audited in
# UNSAFE.md.

# The io program cases on the model (tests/io_cases.rs): the binary is also
# each case's twin, so it runs without libtest.
[[test]]
name = "io_cases"
harness = false
required-features = ["io"]

# The io-2 program cases (processes, temporary files, UV.System, time, stream
# redirection) on the crate (tests/io2_cases.rs): the binary is also each
# case's twin, so it runs without libtest. The cases that set the process
# title run only with `proc-title`.
[[test]]
name = "io2_cases"
harness = false
required-features = ["io"]

# AR-36: the crate's ELF constructors (`proc-title`'s and `startup-fds`'s)
# use no global allocator (tests/ctor_alloc.rs, a binary of its own with a
# counting allocator; without libtest, which allocates before `main`).
[[test]]
name = "ctor_alloc"
harness = false
required-features = ["io"]

# AR-40: a keyed claim of a constant and a keyed take of a reference, with
# their stores and no waiter, allocate nothing (tests/keyed_alloc.rs, a
# binary of its own with a counting allocator).
[[test]]
name = "keyed_alloc"
required-features = ["sched"]

# Program cases in threads mode (tests/threads_twins.rs): the uvloop cases
# over `sched::uv` on its loop thread, each twin inside a task, and the task
# cases of review AR-24. The binary is also each case's twin, so it runs
# without libtest.
[[test]]
name = "threads_twins"
harness = false
required-features = ["io", "threads"]

# Review RT1-03's check (scripts/check.sh runs it): with a C-style entry, the
# alternate signal stacks of the threads that threads mode ends are reused.
[[example]]
name = "threads_altstack_reuse"
required-features = ["threads", "stack-overflow"]

# tests/sched-driver: the program cases with tasks as Rust programs over
# `sched`, with the glue a translator provides (`cargo test -p
# sched-driver`); tests/sched-driver-mt: the task cases' ports, shared with
# it, in threads mode (`cargo test -p sched-driver-mt`, a cargo invocation
# of its own: `threads` and `sched` exclude each other in one build, so
# `--workspace` does not compile; name a package with `-p`). The
# benchmarks are packages of their own.
[workspace]
members = ["tests/sched-driver", "tests/sched-driver-mt"]
default-members = ["."]
exclude = ["benches"]
