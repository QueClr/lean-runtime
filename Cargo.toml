[package]
name = "lean-runtime"
version = "0.1.0"
edition = "2021"
description = "Lean 4.34.0's runtime behaviour, shared by the lean2rr and leanrs translators"
publish = false

[lib]
name = "lean_runtime"
path = "src/lib.rs"

# The default build has no dependencies. The optional layers make their
# system calls and stack switches through vetted crates, so that the crate
# itself stays free of `unsafe` (except the native quirks of UNSAFE.md, each
# behind a feature of its own: so far `proc-title`, the write of the process
# title into the arguments' memory, and `stack-overflow`, Lean's
# stack-overflow report for the scheduler's contexts):
# - `io`: rustix (the FILE model's descriptor calls, the clock, waitpid, kill,
#   the scheduling priority), nix (process-level libc calls: posix_spawn,
#   unshare, poll, the password and group databases, getrusage,
#   gethostname) and io-uring (the two rings libuv makes at startup; pinned
#   exactly, with only `io_safety`, which adds no crate);
# - `sched`: corosensei (decisions Q5 and O2), with its default features
#   (mmap'd stacks with a guard page, and unwinding across the switch),
#   rustix (the event loop's epoll and poll; sched-io), and signal-hook (the
#   `Std.Internal.UV.Signal` watchers: its safe flag, self-pipe and
#   conditional default actions; accepted by the owner, 2026-10-04);
# - `stack-overflow`: nix (its `sigaction` and re-exported libc, for the
#   native quirk of Lean's stack-overflow report, `sched::stack_overflow`;
#   AR-11).
# The requirements are carets compatible with leanrs's offline registry (nix
# 0.31.3, rustix 1.1.4, io-uring 0.7.13, corosensei 0.3.4, signal-hook 0.3.18), with only the features the crate
# uses; leanrs resolves them in its own workspace. lean-runtime's own builds
# and lean2rr's use Cargo.lock and cargo's local registry cache, offline
# (`cargo build --offline --locked --features io,sched`; `cargo fetch
# --locked` once fills the cache).
[dependencies]
rustix = { version = "1.1", optional = true, default-features = false, features = ["std", "event", "fs", "pipe", "process", "stdio", "system", "termios", "time"] }
nix = { version = "0.31", optional = true, default-features = false, features = ["fs", "hostname", "poll", "process", "resource", "sched", "signal", "user"] }
io-uring = { version = "=0.7.13", optional = true, default-features = false, features = ["io_safety"] }
corosensei = { version = "0.3.4", optional = true }
signal-hook = { version = "0.3.18", optional = true, default-features = false }
# `net` only: glibc's getaddrinfo and getnameinfo with libuv's hints (approved
# 2026-10-04, pinned exactly; its unsafe is audited in UNSAFE.md).
dns-lookup = { version = "=2.1.1", optional = true, default-features = false }

[features]
default = []
# OS-level IO mirroring Lean's C runtime (files, handles, standard streams).
io = ["dep:rustix", "dep:nix", "dep:io-uring"]
# The deferred task scheduler, promises and Std.Sync.
sched = ["dep:corosensei", "dep:rustix", "dep:signal-hook"]
# Networking (Std.Internal.UV.TCP/UDP/DNS, Std.Net.interfaceAddresses) on the
# scheduler's event loop: an optional module a translator admits per program.
net = ["io", "sched", "dep:dns-lookup", "rustix/net", "nix/net"]
# The process title in the arguments' memory (`io::argv_title`, a native
# quirk written with `unsafe`: UNSAFE.md, docs/native-quirks.md): the
# crate's ELF constructor keeps the arguments' memory, and `setProcessTitle`
# writes the title there, as libuv does. lean2rr enables it. Without it,
# `setProcessTitle` fails with ENOBUFS, as libuv does when it holds no
# arguments' memory, and `getProcessTitle` gives `argv[0]`.
proc-title = ["io"]
# Lean's stack-overflow report for the scheduler's contexts and the threads
# that run them (`sched::stack_overflow`, a native quirk written with
# `unsafe`: UNSAFE.md, docs/native-quirks.md, AR-11):
# `sched::install_stack_overflow_handler()` installs a SIGSEGV/SIGBUS handler
# that knows the contexts' guard pages, and prints Lean's
# `Stack overflow detected. Aborting.` (status 134). lean2rr enables it.
# Without it, a task that overflows its context's stack ends with a plain
# SIGSEGV (status 139), and the hub updates no record (no cost).
stack-overflow = ["sched", "dep:nix"]
# Opt-in faster implementations that use `unsafe` (see UNSAFE.md and
# docs/development.md).
unsafe-fast = []
# The crate's own code contains no `unsafe` unless `proc-title`,
# `stack-overflow` or `unsafe-fast` is enabled: without them the crate root
# forbids it. The
# `unsafe` of the dependencies is audited in UNSAFE.md.

# The io program cases on the model (tests/io_cases.rs): the binary is also
# each case's twin, so it runs without libtest.
[[test]]
name = "io_cases"
harness = false
required-features = ["io"]

# The io-2 program cases (processes, temporary files, UV.System, time, stream
# redirection) on the crate (tests/io2_cases.rs): the binary is also each
# case's twin, so it runs without libtest. The cases that set the process
# title run only with `proc-title`.
[[test]]
name = "io2_cases"
harness = false
required-features = ["io"]

# tests/sched-driver: the tasks/ and sync/ cases as Rust programs over
# `sched`, with the glue a translator provides (`cargo test -p
# sched-driver`). The benchmarks are packages of their own.
[workspace]
members = ["tests/sched-driver"]
exclude = ["benches"]
